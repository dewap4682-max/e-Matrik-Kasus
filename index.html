<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5737"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="e-Matrik Kasus">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" href="assets/icon-192.png">
  <title>e-Matrik Kasus</title>
<style>
:root{--green:#14744c;--dark:#0b4932;--ink:#172b25;--muted:#708078;--bg:#f3f7f4;--pale:#e8f4ed;--line:#dbe6df;--gold:#d5ad55;--white:#fff;--red:#aa4335;--shadow:0 7px 22px rgba(17,64,43,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding-bottom:calc(18px + env(safe-area-inset-bottom))}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.topbar{position:sticky;top:0;z-index:3;background:rgba(243,247,244,.94);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(219,230,223,.7)}.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brand img{width:42px;height:42px;object-fit:contain;border-radius:50%;background:#e5f2e9}.brand-name{font-weight:800;font-size:17px;letter-spacing:-.2px}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.gear{border:1px solid var(--line);border-radius:50%;width:42px;height:42px;background:white;color:var(--green);font-size:21px;box-shadow:0 2px 8px #103e2b16}.wrap{max-width:760px;margin:0 auto;padding:18px 16px 28px}.hero{text-align:center;padding:3px 0 17px}.pill{display:inline-block;color:white;background:var(--green);font-weight:900;letter-spacing:1.5px;border-radius:99px;padding:12px 26px;box-shadow:0 4px 10px #0a503b2b}.subtle{font-size:12px;color:var(--muted);margin:10px 0 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 12px}.section-head h2{font-size:18px;margin:0}.ghost{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category{min-height:124px;border:1px solid #d9e9df;border-radius:22px;background:#e8f4ed;box-shadow:var(--shadow);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}.category:active{transform:scale(.985)}.cat-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:23px;overflow:hidden;margin-bottom:6px}.cat-icon img{width:100%;height:100%;object-fit:cover}.cat-name{font-size:14px;font-weight:800;max-width:100%;overflow-wrap:anywhere}.cat-hint{font-size:10px;color:var(--muted);margin-top:4px}.edit-cat{position:absolute;right:9px;top:7px;border:0;background:white;color:var(--green);width:28px;height:28px;border-radius:50%;font-size:15px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.info{margin-top:16px;color:var(--muted);font-size:11px;line-height:1.5;text-align:center}.credit{font-size:10px;color:#829087;margin-top:5px}.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--green);color:white;font-weight:800;min-height:44px;box-shadow:0 3px 9px #0b543a1c}.btn.secondary{background:#e8f4ed;color:var(--green);box-shadow:none;border:1px solid #d4e6da}.btn.outline{background:white;color:var(--green);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff0ee;color:var(--red);box-shadow:none}.btn.small{padding:8px 11px;min-height:38px;font-size:12px}.btn.full{width:100%}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.back{border:0;background:transparent;font-size:30px;color:var(--ink);padding:0 8px}.title-row{display:flex;align-items:center;gap:9px;margin:4px 0 13px}.title-row h1{font-size:20px;margin:0}.title-row .sub{font-size:12px;color:var(--muted);margin-top:3px}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--green);font-weight:900}.field-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}input[type=text],input[type=password],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:#f7faf8;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}textarea{min-height:105px;resize:vertical;line-height:1.5}input:focus,textarea:focus,select:focus{border-color:#80b49a;box-shadow:0 0 0 3px #14744c16}.menu-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:white;border:1px solid var(--line);box-shadow:var(--shadow);margin:10px 0}.menu-icon{width:46px;height:46px;flex:none;border-radius:14px;background:var(--pale);display:grid;place-items:center;font-size:22px}.menu-card strong{font-size:14px}.menu-card small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.menu-card .arrow{margin-left:auto;font-size:23px;color:var(--green)}.evidence{background:white;border:1px solid var(--line);border-radius:17px;padding:13px;margin:10px 0}.evidence h3{font-size:14px;color:var(--dark);margin:0 0 8px}.thumbs{display:flex;gap:8px;overflow:auto;padding:9px 0}.thumb{position:relative;width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden;background:#e8f1eb}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;right:4px;top:4px;border:0;background:#a43535;color:#fff;width:23px;height:23px;border-radius:50%;font-weight:900}.label-line{font-size:10px;color:var(--muted);margin:5px 0}.archive-item{background:#f7faf8;border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.archive-item strong{color:var(--dark)}.archive-item .meta{font-size:11px;line-height:1.6;color:var(--muted);margin:5px 0 10px}.toast{position:fixed;z-index:10;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#173c2d;color:#fff;border-radius:99px;padding:11px 16px;font-size:13px;box-shadow:0 5px 20px #0003;max-width:90vw;text-align:center}.scrim{position:fixed;z-index:8;inset:0;background:#10291eb0;display:grid;place-items:center;padding:20px}.modal{width:min(100%,500px);max-height:88vh;overflow:auto;background:white;border-radius:22px;padding:19px;box-shadow:0 18px 60px #0004}.modal h2{font-size:18px;margin:0 0 9px}.modal p{font-size:12px;color:var(--muted);line-height:1.5}.settings-item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ee}.settings-item:last-child{border-bottom:0}.settings-item>div{flex:1}.settings-item small{display:block;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:28px 14px;color:var(--muted);font-size:13px}.install-note{border-left:4px solid var(--gold);background:#fff9e9;border-radius:12px;padding:12px;font-size:12px;line-height:1.5;color:#675329}.status{font-size:11px;color:var(--muted)}.hide{display:none!important}@media(min-width:640px){.wrap{padding-left:22px;padding-right:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="assets/logo-kejari-ponorogo.png" alt="Logo Kejaksaan Negeri Ponorogo"><div><div class="brand-name">e-Matrik Kasus</div><div class="brand-sub">Ruang kerja dokumentasi kasus</div></div></div><button class="gear" id="gear" aria-label="Pengaturan">⚙</button></header>
<main id="app" class="wrap" aria-live="polite"></main><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const DB_NAME='ematrik-pwa-v1', STORE_KV='kv', STORE_MEDIA='media', STORE_REPORTS='reports';
const BASE_TYPES=[{name:'BOS',icon:'📁'},{name:'DPRD',icon:'🏛️'},{name:'BANK BRI',icon:'🏦'}];
const SECTIONS=['Kasus Posisi','Peraturan Dilarang','Unsur Pasal / Alat Bukti','Kerugian Negara','Tersangka'];
const EVIDENCE=['Saksi','Surat','Ahli','Petunjuk','Tersangka / Terdakwa','E-Elektronik'];
let db, state, role=null, screen='home', activeCategory=null, activeSection=null;
const app=document.getElementById('app'), modalRoot=document.getElementById('modalRoot');
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;d.createObjectStore(STORE_KV,{keyPath:'key'});d.createObjectStore(STORE_MEDIA,{keyPath:'id'});d.createObjectStore(STORE_REPORTS,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function getKV(key){return new Promise((resolve,reject)=>{const r=tx(STORE_KV).get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function putKV(key,value){return new Promise((resolve,reject)=>{const r=tx(STORE_KV,'readwrite').put({key,value});r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function getAll(store){return new Promise((resolve,reject)=>{const r=tx(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function putRecord(store,item){return new Promise((resolve,reject)=>{const r=tx(store,'readwrite').put(item);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function delRecord(store,id){return new Promise((resolve,reject)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function today(){return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(new Date())}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
function blankRecord(){return {number:'',date:today(),fields:{},photos:{Tersangka:[],Saksi:[],"E-Elektronik":[]}}}
function recordFor(name){if(!state.records[name])state.records[name]=blankRecord();let r=state.records[name];r.fields ||= {};r.photos ||= {Tersangka:[],Saksi:[],"E-Elektronik":[]};return r}
async function save(){await putKV('state',state)}
async function init(){
  db=await openDb(); state=await getKV('state')||{types:BASE_TYPES.map(x=>({...x})),records:{},credentials:null,sampleRemoved:false};
  state.types ||= BASE_TYPES.map(x=>({...x}));state.records ||= {};await save();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if(!state.credentials)showSetup();else showLogin();
}
async function hashPassword(password,salt){const bytes=new TextEncoder().encode(salt+':'+password);const out=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(out)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function showSetup(){modalRoot.innerHTML=`<div class="scrim"><section class="modal"><h2>Siapkan akun e-Matrik Kasus</h2><p>Buat kata sandi sendiri untuk kedua akun. Minimal 6 karakter. Data akun disimpan pada perangkat ini.</p><label class="field-label">Kata sandi Super User</label><input id="su1" type="password" autocomplete="new-password"><label class="field-label">Ulangi kata sandi Super User</label><input id="su2" type="password"><label class="field-label">Kata sandi Admin</label><input id="ad1" type="password"><label class="field-label">Ulangi kata sandi Admin</label><input id="ad2" type="password"><div style="height:12px"></div><button class="btn full" id="setupSave">Simpan akun</button></section></div>`;
  document.getElementById('setupSave').onclick=async()=>{const a=document.getElementById('su1').value,b=document.getElementById('su2').value,c=document.getElementById('ad1').value,d=document.getElementById('ad2').value;if(a.length<6||c.length<6)return toast('Kata sandi minimal 6 karakter');if(a!==b||c!==d)return toast('Ulangi kata sandi belum cocok');const salt1=crypto.randomUUID(),salt2=crypto.randomUUID();state.credentials={su:{salt:salt1,hash:await hashPassword(a,salt1)},admin:{salt:salt2,hash:await hashPassword(c,salt2)}};await save();role='Super User';modalRoot.innerHTML='';render()}
}
function showLogin(){role=null;screen='home';app.innerHTML=`<div class="hero"><span class="pill">NAMA KASUS</span><p class="subtle">Masuk untuk membuka ruang kerja di perangkat ini.</p></div><section class="card"><div class="eyebrow">PILIH PERAN</div><label class="field-label">Akun</label><select id="loginRole"><option>Super User</option><option>Admin</option></select><label class="field-label">Kata sandi</label><input id="loginPassword" type="password" autocomplete="current-password"><div style="height:12px"></div><button class="btn full" id="loginButton">Masuk</button></section><p class="info">Data dan arsip laporan disimpan lokal pada perangkat ini.</p>`;document.getElementById('gear').classList.add('hide');document.getElementById('loginButton').onclick=async()=>{const r=document.getElementById('loginRole').value,p=document.getElementById('loginPassword').value,c=state.credentials[r==='Super User'?'su':'admin'];if(await hashPassword(p,c.salt)===c.hash){role=r;screen='home';render()}else toast('Kata sandi tidak sesuai')};}
function categoryIconHTML(c){return c.image?`<img src="${c.image}" alt="">`:esc(c.icon||'✦')}
function renderHome(){screen='home';const editBtn=role==='Super User';app.innerHTML=`<div class="hero"><span class="pill">NAMA KASUS</span></div><div class="section-head"><h2>Jenis kasus</h2>${editBtn?'<button class="ghost" id="addType">＋ Tambah</button>':''}</div><div class="grid">${state.types.map(c=>`<button class="category" data-category="${esc(c.name)}"><span class="cat-icon">${categoryIconHTML(c)}</span><span class="cat-name">${esc(c.name)}</span><span class="cat-hint">Ketuk untuk buka menu</span>${editBtn?`<span class="edit-cat" role="button" data-edit="${esc(c.name)}">✎</span>`:''}</button>`).join('')}</div><div class="card info">Data tersimpan lokal · JPG / PDF / Bagikan<div class="credit">Aplikasi ini dikembangkan oleh bolangcorp</div></div>`;
 app.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[data-edit]'))return;activeCategory=b.dataset.category;screen='menu';render()}));app.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openTypeModal(b.dataset.edit)}));document.getElementById('addType')?.addEventListener('click',()=>openTypeModal(null))}
function openTypeModal(oldName){if(role!=='Super User')return;const existing=oldName?state.types.find(x=>x.name===oldName):null;const ico=existing?.icon||'📁';modalRoot.innerHTML=`<div class="scrim"><section class="modal"><h2>${existing?'Edit jenis kasus':'Tambah jenis kasus'}</h2><label class="field-label">Nama jenis kasus</label><input id="typeName" type="text" value="${esc(existing?.name||'')}" placeholder="Contoh: Pengadaan"><label class="field-label">Ikon bawaan</label><select id="typeIcon">${['📁','🏛️','🏦','⚖️','🗂️','💼','🔍','✦'].map(x=>`<option ${x===ico?'selected':''}>${x}</option>`).join('')}</select><label class="field-label">Atau unggah gambar ikon</label><input id="typeImage" type="file" accept="image/*"><div class="row" style="margin-top:14px"><button class="btn secondary" id="typeCancel">Batal</button><button class="btn" id="typeSave">Simpan</button></div>${existing?'<button class="btn danger full" id="typeDelete" style="margin-top:9px">Hapus jenis kasus</button>':''}</section></div>`;
 document.getElementById('typeCancel').onclick=()=>modalRoot.innerHTML='';document.getElementById('typeSave').onclick=async()=>{const name=document.getElementById('typeName').value.trim(),icon=document.getElementById('typeIcon').value,file=document.getElementById('typeImage').files[0];if(!name)return toast('Nama kategori wajib diisi');if(state.types.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.name!==oldName))return toast('Nama kategori sudah digunakan');let image=existing?.image||'';if(file)image=await imageData(file,512);if(existing){const old=existing.name;existing.name=name;existing.icon=icon;existing.image=image;if(old!==name){state.records[name]=state.records[old]||blankRecord();delete state.records[old]}}else state.types.push({name,icon,image});await save();modalRoot.innerHTML='';renderHome()};document.getElementById('typeDelete')?.addEventListener('click',async()=>{if(!confirm(`Hapus kategori ${oldName} dan catatannya?`))return;state.types=state.types.filter(x=>x.name!==oldName);delete state.records[oldName];await save();modalRoot.innerHTML='';renderHome()})}
function metadataInput(key,label,value,type='text',placeholder=''){return `<div><label class="field-label">${label}</label><input type="${type}" data-meta="${key}" value="${esc(value||'')}" placeholder="${placeholder}"></div>`}
function renderMenu(){const c=state.types.find(x=>x.name===activeCategory);if(!c){screen='home';return render()}const r=recordFor(c.name);const icons={'Kasus Posisi':'🗂️','Peraturan Dilarang':'📜','Unsur Pasal / Alat Bukti':'⚖️','Kerugian Negara':'📉','Tersangka':'👤'};app.innerHTML=`<div class="title-row"><button class="back" id="backHome">‹</button><div><h1>${esc(c.name)}</h1><div class="sub">Menu isian dan identitas laporan</div></div></div><section class="card"><div class="eyebrow">IDENTITAS LAPORAN</div><div class="row">${metadataInput('number','Nomor laporan',r.number,'text','Contoh: 001/LP/BOS/2025')}${metadataInput('date','Tanggal laporan',r.date||today(),'text','Contoh: 3 Juni 2025')}</div><div class="label-line">Nomor dan tanggal dapat disesuaikan dengan dokumen sumber.</div></section>${SECTIONS.map(s=>`<button class="menu-card" data-section="${esc(s)}"><span class="menu-icon">${icons[s]}</span><span><strong>${esc(s)}</strong><small>${s==='Unsur Pasal / Alat Bukti'?'Saksi · Surat · Ahli · Petunjuk · Tersangka · E-Elektronik':'Buka dan isi bagian ini'}</small></span><span class="arrow">›</span></button>`).join('')}<section class="card"><div class="eyebrow">LAPORAN</div><button id="saveLocal" class="btn secondary full">Simpan laporan di aplikasi (JPG)</button><div class="row" style="margin-top:9px"><button id="shareJpg" class="btn">Bagikan JPG</button><button id="printPdf" class="btn outline">Cetak / Simpan PDF</button></div><p class="label-line">Simpan dulu di perangkat atau bagikan langsung. Foto lampiran ikut masuk ke JPG.</p></section>${role==='Super User'?`<button class="btn danger full" id="clearCategory">Hapus catatan ${esc(c.name)}</button>`:''}`;
 document.getElementById('backHome').onclick=()=>{screen='home';render()};app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{activeSection=b.dataset.section;screen='section';render()});app.querySelectorAll('[data-meta]').forEach(input=>input.oninput=async()=>{const rec=recordFor(activeCategory);rec[input.dataset.meta]=input.value;await save()});document.getElementById('saveLocal').onclick=()=>saveLocalReport(activeCategory);document.getElementById('shareJpg').onclick=()=>shareJpg(activeCategory);document.getElementById('printPdf').onclick=()=>printPdf(activeCategory);document.getElementById('clearCategory')?.addEventListener('click',async()=>{if(role!=='Super User'||!confirm('Hapus semua catatan pada kategori ini?'))return;state.records[activeCategory]=blankRecord();await save();renderMenu()})}
function fieldText(cat,section,ev){const r=recordFor(cat);return ev?(r.fields['Bukti:'+ev]||''):(r.fields[section]||'')}
function photosFor(cat,field){return recordFor(cat).photos[field]||[]}
function renderSection(){const cat=activeCategory,section=activeSection,r=recordFor(cat);const isEvidence=section==='Unsur Pasal / Alat Bukti';let body='';if(isEvidence){body=EVIDENCE.map(e=>`<section class="evidence"><h3>${esc(e)}</h3><textarea data-field="Bukti:${esc(e)}" placeholder="${esc(evidenceHint(e))}">${esc(fieldText(cat,section,e))}</textarea>${['Saksi','E-Elektronik'].includes(e)?photoControlMarkup(cat,e):''}</section>`).join('')}else body=`<section class="card"><textarea data-field="${esc(section)}" placeholder="${esc(sectionHint(section))}">${esc(fieldText(cat,section))}</textarea>${section==='Tersangka'?photoControlMarkup(cat,'Tersangka'):''}</section>`;app.innerHTML=`<div class="title-row"><button class="back" id="backMenu">‹</button><div><h1>${esc(section)}</h1><div class="sub">${esc(cat)} · tersimpan otomatis</div></div></div><div class="card"><div class="eyebrow">CATATAN MATRIK</div><div class="label-line">Data contoh untuk demonstrasi; ganti dengan dokumen terverifikasi.</div></div>${body}<button class="btn outline full" id="doneSection">Selesai · Kembali ke menu</button>`;document.getElementById('backMenu').onclick=()=>{screen='menu';render()};document.getElementById('doneSection').onclick=()=>{screen='menu';render()};app.querySelectorAll('[data-field]').forEach(t=>t.oninput=async()=>{r.fields[t.dataset.field]=t.value;await save()});app.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange=async()=>{await addPhotos(cat,inp.dataset.photo,inp.files);screen='section';render()});app.querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=async()=>{if(role!=='Super User')return;const f=b.dataset.field,id=b.dataset.removePhoto;r.photos[f]=r.photos[f].filter(x=>x!==id);await delRecord(STORE_MEDIA,id);await save();renderSection()});app.querySelectorAll('[data-preview]').forEach(async img=>{const item=await mediaById(img.dataset.preview);if(item)img.src=URL.createObjectURL(item.blob)})}
function photoControlMarkup(cat,field){const ids=photosFor(cat,field);return `<div style="margin-top:9px"><div class="eyebrow">FOTO ${esc(field.toUpperCase())} · IKUT LAPORAN</div><label class="btn secondary small" style="display:inline-flex;align-items:center;margin-top:7px">Tambah foto <input type="file" accept="image/*" multiple data-photo="${esc(field)}" style="display:none"></label><div class="thumbs">${ids.map(id=>`<div class="thumb"><img data-preview="${esc(id)}" alt="Lampiran">${role==='Super User'?`<button type="button" title="Hapus" data-remove-photo="${esc(id)}" data-field="${esc(field)}">×</button>`:''}</div>`).join('')}</div><div class="label-line">Maksimal 6 foto pada bagian ini.</div></div>`}
function sectionHint(s){return {'Kasus Posisi':'Uraikan kronologi, waktu, tempat, dan fakta penting…','Peraturan Dilarang':'Cantumkan aturan/pasal yang perlu diverifikasi dari sumber resmi…','Kerugian Negara':'Nilai, dasar perhitungan, sumber data, metode, dan status verifikasi…','Tersangka':'Identitas/inisial, peran, dan status sesuai proses hukum…'}[s]||'Isi catatan yang relevan…'}
function evidenceHint(e){return {'Saksi':'Nama/kode saksi, ringkasan keterangan, dan kaitan dengan unsur…','Surat':'Nomor/tanggal dokumen, penerbit, ringkasan, dan relevansi…','Ahli':'Bidang keahlian, pendapat, dan relevansi…','Petunjuk':'Petunjuk dan hubungannya dengan fakta/peristiwa…','Tersangka / Terdakwa':'Identitas/inisial, status, dan kaitan bukti…','E-Elektronik':'Sumber data, perangkat, waktu, metode perolehan, dan pengamanan…'}[e]}
function imageData(file,max=1600){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);if(!b)return reject(Error('Gambar tidak terbaca'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(b)},'image/jpeg',.84)};im.onerror=()=>reject(Error('Gambar tidak dapat dibuka'));im.src=u})}
async function addPhotos(cat,field,files){const r=recordFor(cat),ids=r.photos[field]||[];for(const file of Array.from(files||[]).slice(0,Math.max(0,6-ids.length))){try{const blob=await new Promise(async(resolve,reject)=>{try{const data=await imageData(file,1400);const res=await fetch(data);resolve(await res.blob())}catch(e){reject(e)}});const id=crypto.randomUUID();await putRecord(STORE_MEDIA,{id,blob,name:file.name||'foto.jpg'});ids.push(id)}catch(e){toast('Foto tidak dapat disimpan: '+e.message)}}r.photos[field]=ids;await save();if(files?.length>6)toast('Maksimal 6 foto per bagian');else toast('Foto ditambahkan ke laporan')}
function mediaById(id){return new Promise(resolve=>{const r=tx(STORE_MEDIA).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}
async function makeJpg(cat){const r=recordFor(cat),eText=EVIDENCE.map(e=>`${e}: ${fieldText(cat,'Unsur Pasal / Alat Bukti',e)||'Belum diisi'}`).join('\n');const sections=[['Kasus Posisi',fieldText(cat,'Kasus Posisi')],['Peraturan Dilarang',fieldText(cat,'Peraturan Dilarang')],['Unsur Pasal / Alat Bukti',eText],['Kerugian Negara',fieldText(cat,'Kerugian Negara')],['Tersangka',fieldText(cat,'Tersangka')]];const photos=[...photosFor(cat,'Tersangka').map(id=>({id,label:'Tersangka'})),...photosFor(cat,'Saksi').map(id=>({id,label:'Saksi'})),...photosFor(cat,'E-Elektronik').map(id=>({id,label:'E-Elektronik'}))];let imgs=[];for(const p of photos){const m=await mediaById(p.id);if(m)imgs.push({label:p.label,bitmap:await createImageBitmap(m.blob)})}const W=1200,M=58,content=W-M*2;const measure=document.createElement('canvas').getContext('2d');function lines(t,size=25){measure.font=`${size}px Arial`;let out=[];for(const para of (t||'Belum diisi').split('\n')){let line='';for(const word of para.split(/\s+/)){const n=line?line+' '+word:word;if(measure.measureText(n).width>content&&line){out.push(line);line=word}else line=n}out.push(line||'')};return out}const layouts=sections.map(([title,text])=>{const ls=lines(text,23),attach=title==='Tersangka'?imgs.filter(x=>x.label==='Tersangka'):title==='Unsur Pasal / Alat Bukti'?imgs.filter(x=>x.label!=='Tersangka'):[];return{title,ls,attach,height:Math.max(142,72+ls.length*32+(attach.length?24+Math.ceil(attach.length/3)*145:0))}});let H=310;layouts.forEach(x=>H+=x.height+18);const c=document.createElement('canvas');c.width=W;c.height=H+70;const ctx=c.getContext('2d');ctx.fillStyle='#f3f7f4';ctx.fillRect(0,0,W,c.height);ctx.fillStyle='#0b4932';ctx.fillRect(0,0,W,250);ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.fillText('e-Matrik Kasus',M,68);ctx.font='bold 32px Arial';ctx.fillText(cat, M,122);ctx.font='20px Arial';ctx.fillText(`Nomor: ${r.number||'—'}   ·   Tanggal: ${r.date||'—'}`,M,163);ctx.fillStyle='#14744c';ctx.font='bold 17px Arial';ctx.fillText('RINGKASAN LAPORAN KASUS',M,288);let y=310;for(const s of layouts){ctx.fillStyle='#fff';roundRect(ctx,M,y,content,s.height,18);ctx.fill();ctx.fillStyle='#14744c';ctx.font='bold 24px Arial';ctx.fillText(s.title,M+22,y+38);ctx.fillStyle='#1c2c27';ctx.font='23px Arial';let ty=y+73;s.ls.forEach(line=>{ctx.fillText(line,M+22,ty);ty+=32});s.attach.forEach((im,i)=>{const row=Math.floor(i/3),col=i%3,x=M+22+col*350,py=ty+row*145;ctx.fillStyle='#0b4932';ctx.font='bold 16px Arial';ctx.fillText(`${im.label} · Foto ${i+1}`,x,py+17);const b=im.bitmap,scale=Math.min(300/b.width,110/b.height),w=b.width*scale,h=b.height*scale;ctx.drawImage(b,x,py+25,w,h)});y+=s.height+18}ctx.fillStyle='#728078';ctx.font='16px Arial';ctx.fillText('Data contoh bersifat fiktif · Verifikasi sebelum digunakan · e-Matrik Kasus',M,c.height-24);for(const x of imgs)x.bitmap.close();return await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.92))}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return}r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
async function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function shareJpg(cat){const blob=await makeJpg(cat),file=new File([blob],`e-Matrik-${cat.replace(/\W+/g,'_')}.jpg`,{type:'image/jpeg'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Laporan e-Matrik Kasus'})}catch(e){if(e.name!=='AbortError')toast('Gagal membagikan JPG')}}else{await downloadBlob(blob,file.name);toast('JPG diunduh; bagikan melalui menu iOS')} }
function printHtml(cat){const r=recordFor(cat),ph=[];const rows=SECTIONS.map(s=>`<section><h2>${esc(s)}</h2><p>${esc(s==='Unsur Pasal / Alat Bukti'?EVIDENCE.map(e=>e+': '+(fieldText(cat,s,e)||'Belum diisi')).join('\n'):fieldText(cat,s)||'Belum diisi').replace(/\n/g,'<br>')}</p></section>`).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Laporan ${esc(cat)}</title><style>body{font:14px Arial;color:#18332a;margin:24px}header{background:#0b4932;color:#fff;padding:22px;border-radius:12px}h1{margin:0 0 8px}section{border:1px solid #dbe6df;border-radius:10px;padding:14px;margin:12px 0;break-inside:avoid}h2{color:#14744c;font-size:16px}p{white-space:pre-wrap;line-height:1.5}.mark{color:#8a4c31;font-weight:bold}@media print{button{display:none}body{margin:12mm}}</style></head><body><header><h1>e-Matrik Kasus · ${esc(cat)}</h1><div>Nomor: ${esc(r.number||'—')} · Tanggal: ${esc(r.date||'—')}</div></header>${rows}<p class="mark">Periksa fakta dan lampiran sebelum digunakan atau dibagikan.</p><button onclick="window.print()">Cetak / Simpan PDF</button><script>setTimeout(()=>window.print(),500)<\/script></body></html>`;return html}
function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function printPdf(cat){const w=window.open('','_blank');if(!w){toast('Izinkan pop-up untuk mencetak PDF');return}const r=recordFor(cat);let rows='';for(const s of SECTIONS){const text=s==='Unsur Pasal / Alat Bukti'?EVIDENCE.map(e=>e+': '+(fieldText(cat,s,e)||'Belum diisi')).join('\n'):fieldText(cat,s)||'Belum diisi';let ids=[];if(s==='Tersangka')ids=r.photos.Tersangka||[];if(s==='Unsur Pasal / Alat Bukti')ids=[...(r.photos.Saksi||[]),...(r.photos['E-Elektronik']||[])];let imgs='';for(const id of ids){const m=await mediaById(id);if(m)imgs+=`<img src="${await blobDataUrl(m.blob)}" alt="Lampiran foto">`}rows+=`<section><h2>${esc(s)}</h2><p>${esc(text).replace(/\n/g,'<br>')}</p>${imgs?`<div class="photos">${imgs}</div>`:''}</section>`}const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Laporan ${esc(cat)}</title><style>body{font:14px Arial;color:#18332a;margin:24px}header{background:#0b4932;color:#fff;padding:22px;border-radius:12px}h1{margin:0 0 8px}section{border:1px solid #dbe6df;border-radius:10px;padding:14px;margin:12px 0;break-inside:avoid}h2{color:#14744c;font-size:16px}p{white-space:pre-wrap;line-height:1.5}.photos{display:flex;flex-wrap:wrap;gap:8px}.photos img{width:150px;height:130px;object-fit:contain;background:#f1f5f2;border:1px solid #dbe6df;border-radius:8px}.mark{color:#8a4c31;font-weight:bold}@media print{button{display:none}body{margin:12mm}}</style></head><body><header><h1>e-Matrik Kasus · ${esc(cat)}</h1><div>Nomor: ${esc(r.number||'—')} · Tanggal: ${esc(r.date||'—')}</div></header>${rows}<p class="mark">Periksa fakta dan lampiran sebelum digunakan atau dibagikan.</p><button onclick="window.print()">Cetak / Simpan PDF</button></body></html>`;w.document.open();w.document.write(html);w.document.close();setTimeout(()=>w.print(),700)}
async function saveLocalReport(cat){const blob=await makeJpg(cat),r=recordFor(cat),id=crypto.randomUUID();await putRecord(STORE_REPORTS,{id,blob,category:cat,number:r.number||'',date:r.date||'',createdAt:Date.now(),format:'JPG'});toast('Laporan JPG tersimpan lokal. Buka Pengaturan → Laporan tersimpan.')}
function renderSettings(){screen='settings';app.innerHTML=`<div class="title-row"><button class="back" id="settingsBack">‹</button><div><h1>Pengaturan</h1><div class="sub">Akun, arsip, dan salinan data</div></div></div><section class="card"><div class="eyebrow">AKUN AKTIF</div><h3>${esc(role)}</h3><p class="status">${role==='Super User'?'Kelola kategori, data, dan penghapusan.':'Dapat mengedit, menyimpan, menambah foto, dan membuat backup.'}</p></section><section class="card"><div class="eyebrow">ARSIP LAPORAN</div><button class="btn full" id="openArchive">Lihat laporan tersimpan</button><p class="label-line">Laporan JPG yang disimpan dari menu kasus tampil di sini.</p></section><section class="card"><div class="eyebrow">BACKUP DATA</div><button class="btn secondary full" id="backup">Unduh backup JSON</button><label class="btn outline full" style="display:block;text-align:center;margin-top:8px">Pulihkan backup JSON<input id="restore" type="file" accept="application/json,.json" hidden></label><p class="label-line">Backup ini memuat kategori dan catatan teks; foto dan arsip laporan tidak disertakan.</p></section><section class="install-note"><b>Pasang di iPhone/iPad:</b> buka situs PWA ini di Safari → tombol Bagikan → <b>Add to Home Screen / Tambahkan ke Layar Utama</b>. Perlu situs ber-HTTPS.</section><button id="logout" class="btn outline full" style="margin-top:12px">Keluar</button>`;document.getElementById('settingsBack').onclick=()=>{screen='home';render()};document.getElementById('openArchive').onclick=()=>{screen='archive';render()};document.getElementById('backup').onclick=backupJson;document.getElementById('restore').onchange=restoreJson;document.getElementById('logout').onclick=()=>{role=null;showLogin()}}
async function renderArchive(){screen='archive';const reports=await getAll(STORE_REPORTS);reports.sort((a,b)=>b.createdAt-a.createdAt);app.innerHTML=`<div class="title-row"><button class="back" id="archiveBack">‹</button><div><h1>Laporan tersimpan</h1><div class="sub">Salinan lokal di perangkat ini</div></div></div>${reports.length?reports.map(x=>`<section class="archive-item"><strong>${esc(x.category)} · ${esc(x.format)}</strong><div class="meta">Nomor: ${esc(x.number||'—')}<br>Tanggal: ${esc(x.date||'—')}<br>Disimpan: ${new Date(x.createdAt).toLocaleString('id-ID')}</div><div class="row"><button class="btn secondary small" data-view="${x.id}">Lihat / unduh</button><button class="btn outline small" data-share="${x.id}">Bagikan</button>${role==='Super User'?`<button class="btn danger small" data-del="${x.id}">Hapus</button>`:''}</div></section>`).join(''):'<div class="empty">Belum ada laporan tersimpan.<br>Buka kategori → Simpan laporan di aplikasi.</div>'}`;document.getElementById('archiveBack').onclick=()=>{screen='settings';render()};for(const b of app.querySelectorAll('[data-view]'))b.onclick=async()=>{const x=reports.find(r=>r.id===b.dataset.view);if(x)await downloadBlob(x.blob,`e-Matrik-${x.category}.jpg`)};for(const b of app.querySelectorAll('[data-share]'))b.onclick=async()=>{const x=reports.find(r=>r.id===b.dataset.share);if(x)shareBlob(x.blob,`e-Matrik-${x.category}.jpg`)};for(const b of app.querySelectorAll('[data-del]'))b.onclick=async()=>{if(role!=='Super User'||!confirm('Hapus arsip laporan ini?'))return;await delRecord(STORE_REPORTS,b.dataset.del);renderArchive()}}
async function shareBlob(blob,name){const file=new File([blob],name,{type:blob.type});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Laporan e-Matrik Kasus'})}catch(e){if(e.name!=='AbortError')toast('Gagal membagikan')} }else downloadBlob(blob,name)}
async function backupJson(){const payload={app:'e-Matrik Kasus PWA',version:1,types:state.types,records:state.records};await downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'e-Matrik-Kasus-backup.json')}
async function restoreJson(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.types)||!data.records)throw Error('Format tidak sesuai');state.types=data.types;state.records=data.records;await save();toast('Backup dipulihkan');renderSettings()}catch(err){toast('Backup tidak valid: '+err.message)}}
function render(){if(!role){showLogin();return}if(screen==='home')renderHome();else if(screen==='menu')renderMenu();else if(screen==='section')renderSection();else if(screen==='settings')renderSettings();else if(screen==='archive')renderArchive()}
document.getElementById('gear').addEventListener('click',()=>{if(role){screen='settings';render()}else toast('Masuk terlebih dahulu')});
init().catch(e=>{app.innerHTML=`<section class="card"><h2>Tidak dapat membuka penyimpanan</h2><p>${esc(e.message)}</p></section>`});
</script>
</body></html>
